[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiocatalog"
version = "0.1.0"
description = "Local acoustic-fingerprint index for duplicate audio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ahmed Doghri"}]
dependencies = []

[project.scripts]
audiocatalog = "audiocatalog.cli:main"

[tool.setuptools]
packages = ["audiocatalog"]

[tool.setuptools.package-data]
audiocatalog = ["web/*.html"]
